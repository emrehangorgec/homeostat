[project]
name = "homeostat"
version = "0.0.1"
description = "Policy-constrained, verifiable self-healing for Android dedicated devices"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
homeostat = "homeostat.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["homeostat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
